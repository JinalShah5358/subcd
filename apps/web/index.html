<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <title>IFP Subsidy Platform</title>
    <script>
      /*
       * Apply the stored theme before first paint.
       *
       * React sets this class too, but only after the bundle has parsed and
       * mounted. Without this script a user on dark mode gets a full-screen
       * white flash on every reload — which on a tool people keep open all
       * day is not a small annoyance.
       */
      (function () {
        try {
          var stored = localStorage.getItem('ifp-theme');
          var dark =
            stored === 'dark' ||
            ((!stored || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          /* private mode, or storage disabled — fall through to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
