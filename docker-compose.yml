services:
  postgres:
    image: postgres:16-alpine
    container_name: ifp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ifp_owner
      POSTGRES_PASSWORD: ifp_owner_dev_pw
      POSTGRES_DB: ifp
    ports:
      - "5433:5432"
    volumes:
      - ifp_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ifp_owner -d ifp"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: ifp_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI — http://localhost:8025

volumes:
  ifp_pgdata:
